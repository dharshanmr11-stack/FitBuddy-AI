<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FitBuddy AI - Admin Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #071a1f;
            color: white;
        }

        .login-card {
            width: 90%;
            max-width: 420px;
            padding: 35px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
            text-align: center;
        }

        .icon {
            font-size: 45px;
            margin-bottom: 10px;
        }

        h1 {
            margin-bottom: 8px;
        }

        p {
            color: #b8c8cc;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 16px;
            outline: none;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #20c997;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            color: #8ee6d1;
            text-decoration: none;
        }

        .error {
            background: rgba(255, 70, 70, 0.15);
            color: #ff9b9b;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

    <div class="login-card">

        <div class="icon">🔐</div>

        <h1>Admin Login</h1>

        <p>Enter the administrator key to continue.</p>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form method="post" action="/admin-login">

            <input
                type="password"
                name="key"
                placeholder="Enter Admin Key"
                required
            >

            <button type="submit">
                Login to Admin Dashboard
            </button>

        </form>

        <a class="back" href="/">
            ← Back to Home
        </a>

    </div>

</body>
</html>
